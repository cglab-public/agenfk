# Builds AgEnFK Desktop for macOS, Windows and Linux (CGLAB-171).
#
# A matrix rather than one job because the installers are platform-bound: a
# Windows NSIS installer needs a Windows runner, and macOS signing and
# notarization can only happen on macOS. One runner cannot produce all three.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist:mac
          - os: windows-latest
            target: dist:win
          - os: ubuntu-latest
            target: dist:linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron's binary IS needed here, unlike the ordinary CI job, because
      # electron-builder packages it into the installer.
      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Package
        # --publish never: on a tag electron-builder AUTO-PUBLISHES, and the
        # beta release already exists as a pre-release, so it dies with
        # "existing type not compatible with publishing type". The workflow's
        # job is artifacts, not publishing.
        run: npm run ${{ matrix.target }} -w packages/desktop -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is opt-in: without the secrets the build still produces
          # installers, they simply warn on first launch. Failing the build
          # instead would block every fork and every contributor.
          #
          # AUTO-DISCOVERY HAS TO BE OFF, and that is the half that broke every
          # macOS release. On a runner with no certs electron-builder still
          # finds whatever identity the image ships and tries to sign with an
          # EMPTY password - then dies with the unhelpful "⨯ <project dir> not a
          # file". The flag is set from the secrets so adding both cert and
          # password turns signing back on by itself.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agenfk-desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
          if-no-files-found: error
