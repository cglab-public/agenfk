name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.5) — leave blank to auto-bump patch'
        required: false

# Three jobs (CGLAB-696 story review 2): the version is bumped, tested and packaged; its Airlock
# base image is built from that very commit; only then are the tag and the release published - a
# release whose image is missing fails every `agenfk airlock` launch of that version. The image is
# built here rather than left to the tag push, which starts no workflow when pushed with GITHUB_TOKEN.
jobs:
  prepare:
    name: Bump, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"
          else
            # --match 'v*' so hub-only tags (hub-v*) never feed the framework
            # version math ("hub-v1" is not a major number).
            LATEST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "v0.0.0")
            LATEST=${LATEST#v}
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping patch: $LATEST → $NEXT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Bump version in all package.json files
        run: |
          # bump-version.mjs, not an inline rewrite: it also updates the
          # internal @agenfk/* dependency refs. The inline version set only
          # `version`, so the refs stayed on the old number, the lockfile no
          # longer matched, and `npm ci` went looking for @agenfk/core@<old>
          # on the public registry - a 404, on every release.
          if [ "$(node -p "require('./package.json').version")" = "$VERSION" ]; then
            echo "Already at $VERSION on this ref - nothing to bump."
          else
            node scripts/bump-version.mjs "$VERSION"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Regenerate the lockfile
        # Same commit as the manifests, or they drift apart and the NEXT
        # install is the one that fails.
        run: npm install --package-lock-only --ignore-scripts

      # #249: nothing reaches the remote - not the bump, not the tag - from a
      # ref whose suite is red. The suite runs on the bumped tree, which is
      # exactly what gets tagged.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (release gate)
        run: npm test

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json package-lock.json
          # The documented release flow bumps locally first (bump-version.mjs,
          # committed with the lockfile), so by the time this workflow runs the
          # manifests usually already carry the target version — `git commit`
          # then exits 1 on a clean tree and `set -e` kills the release. A
          # no-op bump is success, not failure.
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "Version already current on this ref — nothing to bump."
          git push

      - name: The commit released
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package distributable
        run: node scripts/package-dist.mjs

      - name: Keep the distributable for the release
        uses: actions/upload-artifact@v7
        with:
          name: agenfk-dist
          path: agenfk-dist.tar.gz
          if-no-files-found: error

  image:
    name: Airlock base image
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/airlock-image.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Tag & Release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit released
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch the distributable
        uses: actions/download-artifact@v7
        with:
          name: agenfk-dist

      - name: Create tag and GitHub release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Scope auto-notes to the previous framework v* tag so an intervening
          # hub-v* release can't truncate the framework changelog.
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "v${VERSION}" | head -1 || true)
          NOTES_ARGS=(--generate-notes)
          if [ -n "$PREV" ]; then NOTES_ARGS+=(--notes-start-tag "$PREV"); fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          # A version with a suffix (1.2.0-beta.1) is a PRE-release, and GitHub
          # has to be told: without this it becomes "Latest" and every user
          # following the stable channel is offered a beta.
          case "$VERSION" in
            *-*) PRERELEASE=(--prerelease) ;;
            *) PRERELEASE=() ;;
          esac
          gh release create "v${VERSION}" agenfk-dist.tar.gz \
            --title "v${VERSION}" "${PRERELEASE[@]}" "${NOTES_ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
