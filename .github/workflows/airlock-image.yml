name: Airlock base image

# CGLAB-696: the image an Airlock session's smolvm machine is made from, built
# from this tag's checkout (the agenfk CLI in it is this version) and pushed,
# for amd64 and arm64, to ghcr.io/<owner>/agenfk-airlock-base:<version> - the
# tag `agenfk airlock` pulls (packages/cli/src/airlock/image.ts). No `latest`:
# a launcher only ever asks for its own version.
on:
  push:
    # Version tags only, as desktop-release.yml: not hub-v* or desktop-v*.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build the image for (e.g. 2.1.0-beta.7), from the ref the workflow runs on'
        required: true
  # release.yml builds the image before it publishes (CGLAB-696 story review 2): a release pushed with
  # GITHUB_TOKEN starts no tag-push run, and a release without its image fails every launch.
  workflow_call:
    inputs:
      version:
        description: 'Version to build the image for'
        type: string
        required: true
      ref:
        description: 'The commit to build it from: the one released'
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The commit asked for, or the one the run was started at - never a branch name, which can
      # move between the dispatch and the checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The version comes in via env, never ${{ }} inside the script: refnames can hold shell metacharacters.
      - name: Resolve version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT" ]; then V="$INPUT"; elif [ "$REF_TYPE" = tag ]; then V="${REF_NAME#v}"; else echo "no version" >&2; exit 1; fi
          # The whole value (bash =~, not grep, which matches line by line).
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "not a version: $V" >&2; exit 1; fi
          # The image carries this checkout's CLI: its tag must be that CLI's version.
          PKG=$(node -p "require('./packages/cli/package.json').version")
          if [ "$V" != "$PKG" ]; then echo "version $V is not this checkout's ($PKG)" >&2; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # What the image is built from, labelled on it: an image published under this version from
      # another commit is not this one.
      - name: The commit built
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release has built the image before it pushes the tag, which runs this workflow again:
      # nothing left to do then - only when both platforms are there, built from this very commit.
      # Only a tag push skips; a call or a dispatch always builds.
      - name: Skip an image already published
        id: published
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/agenfk-airlock-base:${{ steps.version.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          skip=false
          if [ "$EVENT" = push ] && meta=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image}}' 2>/dev/null); then
            skip=true
            for p in linux/amd64 linux/arm64; do
              rev=$(printf '%s' "$meta" | jq -r --arg p "$p" '.[$p].config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)
              [ "$rev" = "$SHA" ] || skip=false
            done
          fi
          if [ "$skip" = true ]; then echo "$IMAGE is published from $SHA already."; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.published.outputs.skip != 'true'

      - name: Build and push image
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: airlock-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agenfk-airlock-base:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
