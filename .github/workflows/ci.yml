name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Without this block a public repo's token
# takes the broad default scope, so a compromised action or dependency in the
# build could write to the repo. This job only needs to read the code.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # CI type-checks and tests the desktop package but never launches it,
          # so skip Electron's ~275 MB prebuilt binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - name: Home-integrity snapshot (item 9c297075)
        run: node scripts/home-integrity.mjs snapshot

      - name: Test
        run: npm test

      #
      # THE UI SPECS, in their own step (BUG 66dee896).
      #
      # They were excluded from `npm test` by a performance commit (218s -> 58s)
      # and the exclusion became a coverage hole: the terminal panes, the split,
      # the fleet sheet and the shell itself ran only when somebody remembered
      # to `cd packages/ui`, while the workflow reported a green suite over a
      # surface it never entered.
      #
      # Their OWN config, not the root one: the ui package sets `environment:
      # jsdom`, its own setup file and the react plugin, and under the root's
      # node environment these files fail in the hundreds. The package already
      # had a `test` script - nothing ran it.
      - name: Test UI (packages/ui)
        run: npm test -w packages/ui

      - name: Home-integrity verify (item 9c297075)
        run: node scripts/home-integrity.mjs verify
