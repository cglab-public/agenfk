name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on pull_request, deliberately. That filter matches the
  # PR's BASE branch, so it silently skipped every PR stacked on another PR's
  # branch — the mid-stack layers got no CI at all while the bottom one looked
  # fine. Deviations from a green run then had to be spotted by hand. Keep it
  # unfiltered so every layer of a stack is checked.
  pull_request:

# Least privilege for GITHUB_TOKEN. Without this block a public repo's token
# takes the broad default scope, so a compromised action or dependency in the
# build could write to the repo. This job only needs to read the code.
permissions:
  contents: read

# Supersede in-flight PR runs of the same ref (notably the pricier Windows minutes); never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Home-integrity snapshot (item 9c297075)
        run: node scripts/home-integrity.mjs snapshot

      - name: Test
        run: npm test

      - name: Home-integrity verify (item 9c297075)
        run: node scripts/home-integrity.mjs verify

  # Issue #201 — Windows coverage without paying for it in wall-clock time.
  #
  # Independent of `build-and-test` (no `needs:`), so both start together and the
  # workflow takes as long as the slower one. It builds only the packages whose
  # code touches paths / child processes / installers (no vite UI builds) and runs
  # the curated subset in vitest.windows.config.ts, under a HOME sandbox with a
  # space and accents so the characters that broke real Windows users are hit on
  # every run. `*.xplat.test.ts` specs are shared with the Linux job.
  #
  # Advisory (`continue-on-error`) while the subset proves stable; remove that
  # line, then mark this job as a required check, once it has.
  windows-compat:
    name: Windows compat
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        # Git Bash, which is what Claude Code uses to run hooks on Windows.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (platform-sensitive packages only)
        run: npm run build -w packages/core -w packages/storage-sqlite -w packages/telemetry && npm run build -w packages/cli -w packages/server

      - name: Home-integrity snapshot
        run: node scripts/home-integrity.mjs snapshot

      - name: Test (Windows subset)
        run: npm run test:windows
        env:
          AGENFK_TEST_UNICODE_HOME: '1'

      - name: Home-integrity verify
        run: node scripts/home-integrity.mjs verify
